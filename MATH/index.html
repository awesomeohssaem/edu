<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 수학 - 받아올림 원리 학습</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap');
        
        body {
            font-family: 'Nanum+Gothic', sans-serif;
            background-color: #f0fdf4;
        }

        .cube {
            width: 30px;
            height: 30px;
            background: #fbbf24;
            border: 2px solid #b45309;
            border-radius: 4px;
            display: inline-block;
            margin: 2px;
            transition: all 0.5s ease;
        }

        .ten-rod {
            width: 34px;
            height: 310px;
            background: #f59e0b;
            border: 2px solid #b45309;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 2px;
            gap: 1px;
        }

        .ten-rod .mini-cube {
            width: 100%;
            height: 28px;
            background: #fbbf24;
            border: 1px solid #b45309;
            border-radius: 2px;
        }

        .pop-up {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .carry-animation {
            animation: moveUp 1s forwards;
        }

        @keyframes moveUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <div class="max-w-3xl w-full bg-white rounded-3xl shadow-xl p-6 md:p-10 border-4 border-green-200">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-green-600 mb-2">💡 받아올림 원리 공부하기</h1>
            <p class="text-gray-600">일모형 10개가 모이면 십모형 1개가 돼요!</p>
            <div class="mt-4 flex justify-center items-center gap-2">
                <span id="progress-dots" class="flex gap-2">
                    <div class="w-4 h-4 rounded-full bg-gray-200"></div>
                    <div class="w-4 h-4 rounded-full bg-gray-200"></div>
                    <div class="w-4 h-4 rounded-full bg-gray-200"></div>
                </span>
                <span class="text-sm font-bold text-gray-400" id="round-text">1 / 3</span>
            </div>
        </div>

        <!-- Problem Section -->
        <div class="flex flex-col md:flex-row justify-around items-center gap-8 mb-10">
            <!-- Math Vertical Form -->
            <div class="text-5xl font-bold flex flex-col items-end gap-2 text-gray-700 relative pr-10 border-r-4 border-dashed border-gray-100 pr-10">
                <div id="num1-text" class="mb-2">7</div>
                <div class="flex items-center">
                    <span class="text-3xl mr-4">+</span>
                    <span id="num2-text">5</span>
                </div>
                <div class="w-24 h-1 bg-gray-800 my-2"></div>
                <input type="number" id="user-answer" class="w-20 text-right outline-none text-green-600 border-b-4 border-green-100 focus:border-green-400 transition-colors" placeholder="?">
            </div>

            <!-- Visual Representation -->
            <div class="flex-1 w-full bg-blue-50 rounded-2xl p-6 relative min-h-[350px]">
                <div class="grid grid-cols-2 gap-4 h-full">
                    <!-- First Number Cubes -->
                    <div class="flex flex-col items-center">
                        <span class="text-sm font-bold text-blue-500 mb-2">첫 번째 수</span>
                        <div id="cubes-area-1" class="flex flex-wrap justify-center content-start gap-1"></div>
                    </div>
                    <!-- Second Number Cubes -->
                    <div class="flex flex-col items-center border-l border-blue-100">
                        <span class="text-sm font-bold text-blue-500 mb-2">두 번째 수</span>
                        <div id="cubes-area-2" class="flex flex-wrap justify-center content-start gap-1"></div>
                    </div>
                </div>

                <!-- Carry Result Visual (Hidden initially) -->
                <div id="visual-result" class="absolute inset-0 bg-blue-50 rounded-2xl flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
                    <div class="flex items-center gap-8">
                        <div class="flex flex-col items-center">
                            <span class="text-xs font-bold text-orange-600 mb-2">십모형 (10)</span>
                            <div id="ten-rod-area"></div>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xs font-bold text-amber-500 mb-2">일모형 (남은 것)</span>
                            <div id="rem-cube-area" class="flex flex-wrap justify-center max-w-[100px]"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Feedback & Controls -->
        <div class="flex flex-col items-center gap-4">
            <div id="feedback-message" class="h-8 text-lg font-bold"></div>
            
            <div class="flex gap-4">
                <button id="check-btn" class="px-8 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-full shadow-lg transition-transform active:scale-95">정답 확인</button>
                <button id="next-btn" class="hidden px-8 py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-full shadow-lg transition-transform active:scale-95">다음 문제</button>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center pop-up">
            <div class="text-6xl mb-4">🥳</div>
            <h2 class="text-2xl font-black text-gray-800 mb-2">참 잘했어요!</h2>
            <p class="text-gray-600 mb-6">모든 문제를 맞혔습니다.<br>받아올림 박사가 되었네요!</p>
            <button onclick="location.reload()" class="w-full py-3 bg-green-500 text-white font-bold rounded-xl hover:bg-green-600 transition-colors">다시 하기</button>
        </div>
    </div>

    <script>
        let currentRound = 1;
        let num1, num2, answer;
        const totalRounds = 3;

        const num1Text = document.getElementById('num1-text');
        const num2Text = document.getElementById('num2-text');
        const userAnswer = document.getElementById('user-answer');
        const cubesArea1 = document.getElementById('cubes-area-1');
        const cubesArea2 = document.getElementById('cubes-area-2');
        const visualResult = document.getElementById('visual-result');
        const tenRodArea = document.getElementById('ten-rod-area');
        const remCubeArea = document.getElementById('rem-cube-area');
        const feedback = document.getElementById('feedback-message');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const roundText = document.getElementById('round-text');
        const dots = document.getElementById('progress-dots').children;

        function generateProblem() {
            // Generate single digits that result in a carry (sum >= 10)
            num1 = Math.floor(Math.random() * 5) + 5; // 5-9
            num2 = Math.floor(Math.random() * 5) + 5; // 5-9
            answer = num1 + num2;

            num1Text.innerText = num1;
            num2Text.innerText = num2;
            userAnswer.value = '';
            userAnswer.disabled = false;
            feedback.innerText = '';
            feedback.className = 'h-8 text-lg font-bold';
            
            visualResult.style.opacity = '0';
            nextBtn.classList.add('hidden');
            checkBtn.classList.remove('hidden');

            renderCubes();
            updateProgress();
        }

        function renderCubes() {
            cubesArea1.innerHTML = '';
            cubesArea2.innerHTML = '';
            
            for(let i=0; i<num1; i++) {
                const c = document.createElement('div');
                c.className = 'cube';
                cubesArea1.appendChild(c);
            }
            
            for(let i=0; i<num2; i++) {
                const c = document.createElement('div');
                c.className = 'cube';
                cubesArea2.appendChild(c);
            }
        }

        function showVisualLogic() {
            tenRodArea.innerHTML = '';
            remCubeArea.innerHTML = '';

            // Create 10-rod
            const rod = document.createElement('div');
            rod.className = 'ten-rod';
            for(let i=0; i<10; i++) {
                const mc = document.createElement('div');
                mc.className = 'mini-cube';
                rod.appendChild(mc);
            }
            tenRodArea.appendChild(rod);

            // Create remaining cubes
            const remainder = answer - 10;
            for(let i=0; i<remainder; i++) {
                const c = document.createElement('div');
                c.className = 'cube';
                remCubeArea.appendChild(c);
            }

            visualResult.style.opacity = '1';
        }

        function updateProgress() {
            roundText.innerText = `${currentRound} / ${totalRounds}`;
            for(let i=0; i<totalRounds; i++) {
                if(i < currentRound - 1) {
                    dots[i].className = 'w-4 h-4 rounded-full bg-green-500';
                } else if (i === currentRound - 1) {
                    dots[i].className = 'w-4 h-4 rounded-full bg-blue-400 animate-pulse';
                } else {
                    dots[i].className = 'w-4 h-4 rounded-full bg-gray-200';
                }
            }
        }

        checkBtn.addEventListener('click', () => {
            const val = parseInt(userAnswer.value);
            if(isNaN(val)) {
                feedback.innerText = '정답을 입력해 주세요!';
                feedback.classList.add('text-orange-500');
                return;
            }

            if(val === answer) {
                feedback.innerText = '맞았어요! 일모형 10개가 십모형 1개로 변했어요!';
                feedback.className = 'h-8 text-lg font-bold text-green-600';
                showVisualLogic();
                userAnswer.disabled = true;
                checkBtn.classList.add('hidden');
                nextBtn.classList.remove('hidden');
            } else {
                feedback.innerText = '다시 한 번 계산해 볼까요?';
                feedback.className = 'h-8 text-lg font-bold text-red-500';
                userAnswer.focus();
            }
        });

        nextBtn.addEventListener('click', () => {
            if(currentRound >= totalRounds) {
                // Mark final dot as complete before showing modal
                dots[totalRounds-1].className = 'w-4 h-4 rounded-full bg-green-500';
                document.getElementById('success-modal').classList.remove('hidden');
            } else {
                currentRound++;
                generateProblem();
            }
        });

        // Initialize first problem
        window.onload = generateProblem;
    </script>
</body>
</html>
