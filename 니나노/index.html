<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>[2026. 니나노] 보드게임 대여 관리</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 아이콘 컴포넌트 헬퍼
    const Icon = ({ name, className }) => {
      useEffect(() => { lucide.createIcons(); }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('list');
      const [games, setGames] = useState([]);
      const [rentals, setRentals] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchTerm, setSearchTerm] = useState("");
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedGame, setSelectedGame] = useState(null);
      const [rentalQty, setRentalQty] = useState(1);
      const [formData, setFormData] = useState({ name: "", affiliation: "", returnDate: "" });
      const [isSubmitting, setIsSubmitting] = useState(false);

      // 데이터 로드 함수 (환경 체크 포함)
      const loadData = () => {
        setLoading(true);
        
        // 구글 서버 환경인지 체크 (ReferenceError 방지)
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((json) => {
              const data = JSON.parse(json);
              setGames(data.games || []);
              setRentals(data.rentals || []);
              setLoading(false);
              setTimeout(() => lucide.createIcons(), 100);
            })
            .withFailureHandler((err) => {
              console.error("데이터 로드 실패:", err);
              setLoading(false);
            })
            .getData();
        } else {
          // 구글 외부 환경(Canvas 미리보기 등)일 때 보여줄 데모 데이터
          console.warn("구글 서버 환경이 아닙니다. 데모 데이터를 로드합니다.");
          setTimeout(() => {
            setGames([
              { name: "할리갈리 (데모)", school: "중앙관", total: 5, available: 3 },
              { name: "루미큐브 (데모)", school: "본관", total: 3, available: 0 },
              { name: "스플렌더 (데모)", school: "도서실", total: 4, available: 2 },
            ]);
            setRentals([
              { gameName: "루미큐브 (데모)", qty: 1, renter: "홍길동", dept: "니나노초", startDate: "2026-04-20", dueDate: "2026-04-27", status: "대여중" }
            ]);
            setLoading(false);
            setTimeout(() => lucide.createIcons(), 100);
          }, 800);
        }
      };

      useEffect(() => { loadData(); }, []);

      const today = new Date().toISOString().split('T')[0];

      const handleBorrow = () => {
        setIsSubmitting(true);
        const payload = JSON.stringify({
          ...formData,
          gameName: selectedGame.name,
          rentalQty: rentalQty,
          startDate: today,
          status: "대여중"
        });

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(() => {
              alert(`${selectedGame.name} ${rentalQty}개 대여 신청이 완료되었습니다.`);
              setIsModalOpen(false);
              setFormData({ name: "", affiliation: "", returnDate: "" });
              setTimeout(loadData, 1500);
              setIsSubmitting(false);
            })
            .postData(payload);
        } else {
          alert("데모 모드입니다. 실제 시트에 기록되지 않습니다.");
          setIsSubmitting(false);
          setIsModalOpen(false);
        }
      };

      const filteredGames = games.filter(g => 
        String(g.name).toLowerCase().includes(searchTerm.toLowerCase()) ||
        String(g.school).toLowerCase().includes(searchTerm.toLowerCase())
      );

      const filteredRentals = rentals.filter(r => 
        String(r.gameName).toLowerCase().includes(searchTerm.toLowerCase()) ||
        String(r.renter).toLowerCase().includes(searchTerm.toLowerCase()) ||
        String(r.dept).toLowerCase().includes(searchTerm.toLowerCase())
      );

      return (
        <div className="min-h-screen">
          {/* 상단 네비게이션 */}
          <nav className="bg-white border-b sticky top-0 z-20 shadow-sm px-4">
            <div className="max-w-5xl mx-auto">
              <div className="h-16 flex items-center justify-between">
                <div className="flex items-center gap-2 text-blue-600 font-bold text-xl">
                  <Icon name="library" className="w-8 h-8" />
                  <span class="hidden sm:inline">[2026. 니나노] 보드게임 대여 관리</span>
                  <span class="sm:hidden">니나노 대여 관리</span>
                </div>
                <button onClick={loadData} className="p-2 hover:bg-slate-100 rounded-full transition-colors">
                  <Icon name="refresh-cw" className={`w-5 h-5 text-slate-500 ${loading ? 'animate-spin' : ''}`} />
                </button>
              </div>
              <div className="flex gap-6 h-12">
                <button 
                  onClick={() => { setActiveTab('list'); setSearchTerm(""); }} 
                  className={`px-1 border-b-2 font-bold text-sm transition-all ${activeTab === 'list' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'}`}
                >
                  보드게임 목록
                </button>
                <button 
                  onClick={() => { setActiveTab('status'); setSearchTerm(""); }} 
                  className={`px-1 border-b-2 font-bold text-sm transition-all ${activeTab === 'status' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-400'}`}
                >
                  대여 현황
                </button>
              </div>
            </div>
          </nav>

          <main className="max-w-5xl mx-auto p-4 space-y-6">
            {/* 검색창 */}
            <div className="bg-white p-3 rounded-2xl shadow-sm border relative">
              <div className="absolute left-7 top-1/2 -translate-y-1/2 text-slate-400">
                <Icon name="search" className="w-5 h-5" />
              </div>
              <input 
                type="text" 
                placeholder={activeTab === 'list' ? "보드게임 이름 또는 보관 위치 검색..." : "대여자, 게임명, 소속 검색..."}
                className="w-full pl-12 pr-4 py-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium transition-all" 
                value={searchTerm} 
                onChange={e => setSearchTerm(e.target.value)} 
              />
            </div>

            {/* 메인 테이블 */}
            <div className="bg-white rounded-2xl shadow-md border overflow-hidden">
              <div className="overflow-x-auto">
                {activeTab === 'list' ? (
                  /* 보드게임 목록 */
                  <table className="w-full text-left border-collapse">
                    <thead className="bg-slate-50 border-b">
                      <tr className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                        <th className="px-6 py-4">보드게임 이름</th>
                        <th className="px-6 py-4">보관 위치</th>
                        <th className="px-6 py-4 text-center">잔여 / 총 수량</th>
                        <th className="px-6 py-4 text-center">신청</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {loading && games.length === 0 ? (
                        <tr><td colSpan="4" className="px-6 py-24 text-center text-slate-400 font-medium">로딩 중...</td></tr>
                      ) : filteredGames.map((game, idx) => {
                        const available = parseInt(game.available || 0);
                        const isStockOut = available <= 0;
                        return (
                          <tr key={idx} className="hover:bg-slate-50/50 transition-colors">
                            <td className="px-6 py-5 font-bold text-lg text-slate-800">{game.name}</td>
                            <td className="px-6 py-5 text-slate-600 font-medium">{game.school}</td>
                            <td className="px-6 py-5 text-center text-xl font-black">
                              <span className={isStockOut ? 'text-red-500' : 'text-blue-600'}>
                                {Math.max(0, available)} / {game.total}
                              </span>
                            </td>
                            <td className="px-6 py-5 text-center">
                              <button 
                                onClick={() => { setSelectedGame(game); setRentalQty(1); setIsModalOpen(true); }} 
                                disabled={isStockOut} 
                                className={`px-5 py-2.5 rounded-xl text-sm font-bold w-32 shadow-sm transition-all active:scale-95 ${isStockOut ? "bg-slate-100 text-slate-400" : "bg-blue-600 text-white hover:bg-blue-700"}`}
                              >
                                {isStockOut ? "재고없음" : "대여하기"}
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                ) : (
                  /* 대여 현황 */
                  <table className="w-full text-left border-collapse">
                    <thead className="bg-slate-50 border-b">
                      <tr className="text-xs font-bold text-slate-500 text-center uppercase tracking-wider">
                        <th className="px-6 py-4 text-left">대여자 (소속)</th>
                        <th className="px-6 py-4 text-left">대여 게임</th>
                        <th className="px-6 py-4">수량</th>
                        <th className="px-6 py-4">반납 예정일</th>
                        <th className="px-6 py-4">상태</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {loading && rentals.length === 0 ? (
                        <tr><td colSpan="5" className="px-6 py-24 text-center text-slate-400 font-medium">데이터 로딩 중...</td></tr>
                      ) : filteredRentals.length > 0 ? (
                        filteredRentals.map((rental, idx) => {
                          const statusText = String(rental.status || "");
                          const isReturned = statusText.includes("반납") || statusText.includes("완료");
                          const isOverdue = !isReturned && new Date(rental.dueDate) < new Date(today);
                          return (
                            <tr key={idx} className={`hover:bg-slate-50/50 transition-colors ${isReturned ? 'opacity-50' : ''}`}>
                              <td className="px-6 py-5">
                                <div className="font-bold text-slate-800">{rental.renter}</div>
                                <div className="text-xs text-slate-400 font-medium">{rental.dept}</div>
                              </td>
                              <td className="px-6 py-5 font-bold text-slate-700">{rental.gameName}</td>
                              <td className="px-6 py-5 text-center text-blue-600 font-black">{rental.qty}개</td>
                              <td className="px-6 py-5 text-center font-bold text-slate-600">{String(rental.dueDate).split('T')[0]}</td>
                              <td className="px-6 py-5 text-center">
                                <span className={`px-3 py-1 rounded-full text-[10px] font-black border-2 uppercase ${isReturned ? 'bg-slate-50 text-slate-400 border-slate-200' : (isOverdue ? 'bg-red-50 text-red-600 border-red-200' : 'bg-green-50 text-green-700 border-green-200')}`}>
                                  {isReturned ? "반납됨" : (isOverdue ? "⚠️ 연체" : "대여중")}
                                </span>
                              </td>
                            </tr>
                          );
                        })
                      ) : (
                        <tr><td colSpan="5" className="px-6 py-20 text-center text-slate-400 font-medium">현재 대여 중인 내역이 없습니다.</td></tr>
                      )}
                    </tbody>
                  </table>
                )}
              </div>
            </div>
          </main>

          {/* 대여 신청 모달 */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
                <div className="px-6 py-5 bg-blue-600 text-white flex justify-between items-center shadow-lg">
                  <h2 className="text-xl font-bold flex items-center gap-2"><Icon name="package" className="w-5 h-5" /> 대여 신청</h2>
                  <button onClick={() => setIsModalOpen(false)} className="p-1 hover:bg-blue-700 rounded-lg transition-colors">
                    <Icon name="x" className="w-6 h-6" />
                  </button>
                </div>
                <div className="p-6 space-y-5">
                  <div className="p-4 bg-blue-50 rounded-2xl border border-blue-100 shadow-sm space-y-3">
                    <div>
                      <p className="text-xs text-blue-500 font-bold mb-1 uppercase tracking-widest">신청 보드게임</p>
                      <p className="text-lg font-black text-blue-900">{selectedGame?.name}</p>
                    </div>
                    <div className="flex items-center justify-between border-t border-blue-200 mt-3 pt-3">
                      <p className="text-sm font-bold text-blue-700">대여 수량 선택</p>
                      <div className="flex items-center gap-4 bg-white px-3 py-1.5 rounded-xl border border-blue-200 shadow-sm">
                        <button 
                          type="button" 
                          onClick={() => rentalQty > 1 && setRentalQty(rentalQty - 1)} 
                          className="text-blue-600 p-1 hover:bg-blue-50 rounded transition-colors disabled:opacity-30"
                          disabled={rentalQty <= 1}
                        >
                          <Icon name="minus" className="w-5 h-5 stroke-[3px]" />
                        </button>
                        <span className="text-lg font-black min-w-[20px] text-center">{rentalQty}</span>
                        <button 
                          type="button" 
                          onClick={() => rentalQty < parseInt(selectedGame?.available || 0) && setRentalQty(rentalQty + 1)} 
                          className="text-blue-600 p-1 hover:bg-blue-50 rounded transition-colors disabled:opacity-30"
                          disabled={rentalQty >= parseInt(selectedGame?.available || 0)}
                        >
                          <Icon name="plus" className="w-5 h-5 stroke-[3px]" />
                        </button>
                      </div>
                    </div>
                    <p className="text-blue-400 text-right font-bold text-[10px]">최대 대여 가능: {selectedGame?.available}개</p>
                  </div>

                  <div className="space-y-1">
                    <label className="text-sm font-bold text-slate-700 flex items-center gap-1"><Icon name="user" className="w-4 h-4 text-blue-500" /> 대여자 이름</label>
                    <input 
                      type="text" 
                      placeholder="성함을 입력하세요" 
                      className="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium transition-all shadow-inner" 
                      value={formData.name} 
                      onChange={e => setFormData({...formData, name: e.target.value})} 
                    />
                  </div>
                  <div className="space-y-1">
                    <label className="text-sm font-bold text-slate-700 flex items-center gap-1"><Icon name="building-2" className="w-4 h-4 text-blue-500" /> 소속 (예. OO초)</label>
                    <input 
                      type="text" 
                      placeholder="예: OO초 5-1 / 교무실" 
                      className="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium transition-all shadow-inner" 
                      value={formData.affiliation} 
                      onChange={e => setFormData({...formData, affiliation: e.target.value})} 
                    />
                  </div>
                  <div className="space-y-1">
                    <label className="text-sm font-bold text-slate-700 flex items-center gap-1"><Icon name="calendar" className="w-4 h-4 text-blue-500" /> 반납 예정일</label>
                    <input 
                      type="date" 
                      min={today} 
                      className="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium transition-all shadow-inner" 
                      value={formData.returnDate} 
                      onChange={e => setFormData({...formData, returnDate: e.target.value})} 
                    />
                  </div>

                  <button 
                    onClick={handleBorrow} 
                    disabled={isSubmitting || !formData.name || !formData.returnDate} 
                    className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-lg shadow-xl shadow-blue-100 hover:bg-blue-700 active:scale-95 disabled:bg-slate-300 transition-all flex items-center justify-center gap-2 mt-2"
                  >
                    {isSubmitting ? (
                      <div className="flex items-center gap-2">
                        <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                        <span>전송 중...</span>
                      </div>
                    ) : "대여 신청 완료"}
                  </button>
                </div>
              </div>
            </div>
          )}
          <footer className="max-w-5xl mx-auto px-4 py-12 text-center text-slate-400 text-xs font-bold uppercase tracking-widest mt-12 border-t border-slate-100">
            © 2026 니나노 BoardGame Rental System • Built for Education
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
