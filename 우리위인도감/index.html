<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>우리 위인 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한지 위에 놓인 위인 카드 도감 — 상단 도장판, 시대 탭, 카드 그리드, 펼쳐 보는 카드 창 */
:root{
  --paper:#F6F4EC; --card:#FFFFFF; --ink:#23262B; --muted:#5E6470; --line:#E2DED0;
  --hong:#C8382E; --cheong:#1E5C8A; --hwang:#D9A02B; --nok:#2E7D5B; --heuk:#3B3F47;
  --soft:#FBF3E2; --seal:#C8382E; --shadow:0 2px 0 rgba(35,38,43,.08),0 8px 22px rgba(35,38,43,.08);
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B1D21; --card:#25282E; --ink:#F1EEE6; --muted:#B4B7BE; --line:#383C44;
  --hong:#F06A5E; --cheong:#6FAEE0; --hwang:#F0C25A; --nok:#5FC495; --heuk:#9AA0AA;
  --soft:#2D2A22; --seal:#E85A4F; --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1D21; --card:#25282E; --ink:#F1EEE6; --muted:#B4B7BE; --line:#383C44;
  --hong:#F06A5E; --cheong:#6FAEE0; --hwang:#F0C25A; --nok:#5FC495; --heuk:#9AA0AA;
  --soft:#2D2A22; --seal:#E85A4F; --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--cheong);outline-offset:3px}

/* 머리 */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{width:56px;height:56px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.1;margin:0;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:17px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stampbox{display:flex;align-items:center;gap:10px;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:6px 14px}
.stampbox b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--seal);font-variant-numeric:tabular-nums}
.stampbox span{color:var(--muted);font-size:15px}
.btn{border:none;border-radius:999px;padding:10px 20px;font-family:var(--display);font-size:20px;background:var(--cheong);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.hong{background:var(--hong)}
:root[data-theme="dark"] .btn:not(.ghost),:root:not([data-theme="light"]) .btn:not(.ghost){color:#fff}

/* 시대 줄 */
.eras{display:flex;gap:8px;overflow-x:auto;margin-top:22px;padding-bottom:4px}
.era{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-family:var(--display);font-size:19px}
.era[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.era i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;margin-top:18px}
.card{position:relative;background:var(--card);border:none;border-radius:16px;padding:10px 10px 12px;text-align:center;box-shadow:var(--shadow);transition:transform .15s ease}
.card:hover{transform:translateY(-4px) rotate(-.6deg)}
.card .ph{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--soft)}
.card .nm{display:block;font-family:var(--display);font-size:24px;margin-top:8px;line-height:1.2}
.card .tag{display:inline-block;margin-top:4px;font-size:14px;color:var(--muted)}
.card .band{position:absolute;left:10px;right:10px;top:10px;height:6px;border-radius:10px 10px 0 0}
.seal{position:absolute;right:4px;top:4px;width:58px;height:58px;border-radius:50%;border:3px solid var(--seal);color:var(--seal);
  font-family:var(--display);font-size:15px;line-height:1.05;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 82%,transparent);
  transform:rotate(-14deg);opacity:0;scale:1.6;transition:opacity .25s,scale .25s}
.card.done .seal{opacity:.92;scale:1}

/* 카드 창 */
dialog{border:none;padding:0;border-radius:22px;background:var(--card);color:var(--ink);width:min(860px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,22,26,.55)}
.dlg{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:24px}
.dlg-photo{display:flex;flex-direction:column;gap:12px;align-items:center}
.dlg-photo img{width:100%;max-width:240px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--soft)}
.dlg-body{min-width:0}
.chip{display:inline-block;color:#fff;border-radius:999px;padding:2px 12px;font-size:15px;font-family:var(--display)}
.dlg h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,46px);margin:6px 0 0;line-height:1.1}
.nick{margin:4px 0 14px;color:var(--muted);font-size:19px}
.sec{font-family:var(--display);font-size:21px;margin:14px 0 6px;color:var(--cheong)}
.did{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.did li{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;font-size:19px}
.did li span:first-child{font-size:24px;line-height:1.3}
.say{margin:16px 0 0;background:var(--soft);border-radius:14px;padding:14px 18px;border-left:6px solid var(--hwang)}
.say .lb{font-family:var(--display);font-size:17px;color:var(--muted)}
.say q{display:block;font-family:var(--display);font-size:clamp(22px,3.4vw,27px);line-height:1.35;quotes:"“" "”";margin:2px 0 4px}
.say small{color:var(--muted);font-size:15px;display:block}
.try{margin-top:12px;border:2px dashed var(--nok);border-radius:14px;padding:12px 16px;font-size:19px}
.try b{font-family:var(--display);font-weight:400;color:var(--nok);margin-right:6px}
.dlg-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:0 24px 22px}
.dlg-nav .grp{display:flex;gap:8px;flex-wrap:wrap}
.x{position:absolute;right:12px;top:10px;width:44px;height:44px;border-radius:50%;border:none;background:var(--soft);font-size:24px;line-height:1}

/* 퀴즈 */
.qz{padding:26px 24px 22px}
.qz h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
.qz .clue{font-size:22px;margin:10px 0 16px;background:var(--soft);border-radius:14px;padding:14px 18px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.opt img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
.opt span{display:block;font-family:var(--display);font-size:22px;margin-top:6px}
.opt.ok{border-color:var(--nok);background:color-mix(in srgb,var(--nok) 14%,var(--card))}
.opt.no{border-color:var(--hong);opacity:.6}
.fb{min-height:40px;font-family:var(--display);font-size:24px;margin:14px 0 4px;text-align:center}
.fb.ok{color:var(--nok)}.fb.no{color:var(--hong)}
.qz .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.score{color:var(--muted);font-size:16px;margin-top:2px}

.chk{padding:30px 24px 26px;text-align:center}
.chk h3{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);margin:0 0 6px;text-wrap:balance}
.chk .hint{color:var(--muted);margin:0 0 16px}
.chk img{width:150px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--soft)}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px auto 0;max-width:620px}
.nameb{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;font-family:var(--display);font-size:clamp(20px,3vw,26px)}
.nameb.ok{border-color:var(--nok);background:color-mix(in srgb,var(--nok) 14%,var(--card))}
.nameb.no{border-color:var(--hong);opacity:.5}
.chk .fb{min-height:44px}
.bigseal{display:inline-grid;place-items:center;width:132px;height:132px;border-radius:50%;border:5px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:24px;line-height:1.15;white-space:nowrap;transform:rotate(-12deg);margin-top:6px;animation:thump .35s ease-out}
@keyframes thump{from{transform:rotate(-12deg) scale(1.8);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.cf{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,22,26,.45);padding:16px;z-index:5}
.cf-box{background:var(--card);color:var(--ink);border-radius:20px;padding:24px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.cf-box img{width:96px;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.cf-box p{font-family:var(--display);font-size:24px;line-height:1.35;margin:10px 0 4px;text-wrap:balance}
.cf-box small{display:block;color:var(--hong);font-size:16px;min-height:22px}
.cf-box .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.foot{margin-top:28px;color:var(--muted);font-size:14px;text-align:center}

@media (max-width:640px){
  .dlg{grid-template-columns:1fr;gap:12px;padding:20px 18px}
  .dlg-photo img{max-width:170px}
  .dlg-nav{padding:0 18px 18px}
  .opts{gap:8px}.opt span{font-size:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="25" fill="none" stroke="var(--seal)" stroke-width="4"/>
        <text x="28" y="37" text-anchor="middle" font-family="Jua, sans-serif" font-size="25" fill="var(--seal)">위인</text>
      </svg>
      <div style="min-width:0">
        <h1>우리 위인 도감</h1>
        <p class="sub">위인 카드를 눌러서 어떤 일을 했는지 알아봐요!</p>
      </div>
    </div>
    <div class="tools">
      <div class="stampbox" aria-live="polite"><b id="cnt">0 / 21</b><span>도장 모았어요</span></div>
      <button class="btn hong" id="quizBtn" type="button">누구일까요? 퀴즈</button>
      <button class="btn ghost" id="resetBtn" type="button">도장 지우기</button>
    </div>
  </header>

  <nav class="eras" id="eras" aria-label="시대 고르기"></nav>
  <main class="grid" id="grid"></main>
  <p class="foot">노래 ‘한국을 빛낸 100명의 위인들’에 나오는 인물 가운데 대표 위인을 골랐어요. ‘상상 그림’은 진짜 얼굴이 남아 있지 않거나 사진을 넣지 못해 새로 그린 캐릭터예요.<br>설명은 초등학교 2학년이 읽기 쉽도록 짧게 풀어 썼어요. ‘○○라고 전해져요’는 옛이야기로 내려오는 내용이에요.</p>
</div>

<dialog id="dlg" aria-labelledby="dName">
  <button class="x" type="button" data-close aria-label="닫기">×</button>
  <div id="view">
  <div class="dlg">
    <div class="dlg-photo"><img id="dImg" alt=""><button class="btn" id="speak" type="button">🔊 읽어 주기</button></div>
    <div class="dlg-body">
      <span class="chip" id="dEra"></span>
      <h2 id="dName"></h2>
      <p class="nick" id="dNick"></p>
      <div class="sec">이런 일을 했어요</div>
      <ul class="did" id="dDid"></ul>
      <div class="say"><div class="lb" id="dSayLb"></div><q id="dSay"></q><small id="dSayNote"></small></div>
      <div class="try"><b>나도 해 볼까?</b><span id="dTry"></span></div>
    </div>
  </div>
  <div class="dlg-nav">
    <div class="grp"><button class="btn ghost" id="prev" type="button">◀ 이전 위인</button><button class="btn ghost" id="next" type="button">다음 위인 ▶</button></div>
    <button class="btn" type="button" id="doneBtn">다 읽었어요!</button>
  </div>
  </div>
  <div class="cf" id="cf" hidden role="alertdialog" aria-labelledby="cfMsg">
    <div class="cf-box">
      <img id="cfImg" alt="">
      <p id="cfMsg"></p>
      <small id="cfWarn"></small>
      <div class="row"><button class="btn ghost" id="cfNo" type="button">아니요, 계속 읽을래요</button><button class="btn" id="cfYes" type="button">네, 넘어갈래요</button></div>
    </div>
  </div>
  <div class="chk" id="chk" hidden>
    <h3>이 위인의 이름은 무엇이었나요?</h3>
    <p class="hint">맞히면 ‘참 잘했어요’ 도장을 받아요!</p>
    <img id="cImg" alt="">
    <div class="names" id="cNames"></div>
    <div class="fb" id="cFb" aria-live="polite"></div>
    <div class="row" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn ghost" id="cBack" type="button">카드 다시 읽기</button></div>
  </div>
</dialog>

<dialog id="qdlg" aria-labelledby="qTitle">
  <button class="x" type="button" data-close aria-label="닫기">×</button>
  <div class="qz">
    <h2 id="qTitle">누구일까요?</h2>
    <p class="score" id="qScore"></p>
    <div class="clue" id="qClue"></div>
    <div class="opts" id="qOpts"></div>
    <div class="fb" id="qFb" aria-live="polite"></div>
    <div class="row"><button class="btn ghost" id="qSee" type="button" hidden>설명 보러 가기</button><button class="btn" id="qNext" type="button">다음 문제</button></div>
  </div>
</dialog>

function step(d){
  const list = visible(); let i = list.findIndex(x => x.id===cur.id);

let cfDir = 0;
const josa = (w, a, b) => { const c = w.charCodeAt(w.length-1); return (c>=44032 && c<=55203 && (c-44032)%28) ? a : b; };
function askStep(d){
  stopSpeak();

  const tgt = i<0 ? list[0] : list[(i+d+list.length)%list.length];
  cfDir = d;
  $('cfImg').src = src(tgt); $('cfImg').alt = tgt.name;
  const nm = tgt.name.replace(/\(.*\)/,'');

  $('cfWarn').textContent = done.has(cur.id) ? '' : `아직 ${cur.name} 도장을 받지 않았어요.`;

}

const canSpeak = 'speechSynthesis' in window;
if(!canSpeak) $('speak').hidden = true;
function stopSpeak(){ if(canSpeak) speechSynthesis.cancel(); $('speak').textContent = '🔊 읽어 주기'; }
$('speak').onclick = () => {
  if(!canSpeak) return;
  if(speechSynthesis.speaking){ stopSpeak(); return; }
  const p = cur, clean = s => s.replace(/[^\p{L}\p{N}\s.,!?“”‘’·()]/gu,'');
  const text = [p.name+'.', p.nick+'.', ...p.did.map(d=>clean(d[1])), p.say[0]+'. '+p.say[1], '나도 해 볼까요? '+p.try].join(' ');
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ko')); if(v) u.voice = v;
  u.onend = () => { $('speak').textContent = '🔊 읽어 주기'; };
  speechSynthesis.speak(u); $('speak').textContent = '⏹ 그만 읽기';
};

}
$('qOpts').addEventListener('click', e => {

  qLock = true; qTot++;

  $('qOpts').querySelectorAll('.opt').forEach(o => { if(o.dataset.id===qAns.id) o.classList.add('ok'); else if(o===b) o.classList.add('no'); });
  $('qFb').textContent = right ? `딩동댕! ${qAns.name}${/[가-힣]$/.test(qAns.name) && (qAns.name.charCodeAt(qAns.name.length-1)-44032)%28 ? '이에요' : '예요'}!` : `아쉬워요! 정답은 ${qAns.name}`;
  $('qFb').className = 'fb ' + (right ? 'ok' : 'no');
  $('qSee').hidden = false;
  $('qScore').textContent = `지금까지 ${qTot}문제 중 ${qGot}문제 맞혔어요`;
});
$('qNext').onclick = newQ;
$('qSee').onclick = () => { qdlg.close(); openPerson(qAns.id); };

$('cNames').addEventListener('click', e => {
  const b = e.target.closest('.nameb'); if(!b || cLock || b.disabled) return;
  if(b.dataset.id === cur.id){
    cLock = true; b.classList.add('ok');
    stamp();
    $('cFb').className = 'fb ok';
    $('cFb').innerHTML = '<span class="bigseal">참<br>잘했어요</span>';
    $('cBack').hidden = true;
    setTimeout(() => { if(dlg.open) dlg.close(); }, 1600);
  } else {
    b.classList.add('no'); b.disabled = true;
    $('cFb').className = 'fb no'; $('cFb').textContent = '아쉬워요! 다시 골라 볼까요?';
  }
});
$('cBack').onclick = () => { $('view').hidden = false; $('chk').hidden = true; };
/* 도장 지우기: 두 번 눌러 확인 */
let resetArm = null;
$('resetBtn').onclick = () => {
  const b = $('resetBtn');
  if(resetArm){ clearTimeout(resetArm); resetArm = null; done = new Set(); save(); renderGrid(); b.textContent = '도장 지우기'; return; }
  b.textContent = '한 번 더 누르면 지워져요'; resetArm = setTimeout(() => { resetArm = null; b.textContent = '도장 지우기'; }, 3000);
};

renderEras(); renderGrid();
</script>
