            tomorrow: { icon: 'rain', max: '20', min: '14' }
        };
        const IMAGE_KEY = 'weathercast.images';
        const CUSTOM_KEY = 'weathercast.customWeather';

        const loadSaved = (key, fallback) => {
            try {
                const v = localStorage.getItem(key);
                return v ? { ...fallback, ...JSON.parse(v) } : fallback;
            } catch (e) { return fallback; }
        };
        const saveData = (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); return true; }
            catch (e) { return false; }
        };

        // 올린 사진을 화면 크기(가로 1920px)로 줄여서 저장 용량을 아낌
        const resizeImage = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, 1920 / img.width);
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * scale);
                    c.height = Math.round(img.height * scale);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    resolve(c.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = reject;
                img.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });

        // 화면을 꽉 채우는(object-cover) 16:9 영상·그림과 똑같은 크기의 상자.
        // 이 안에 % 위치로 글자를 놓으면 화면 비율이 달라도 그림의 같은 자리에 맞춰집니다.
        const CoverBox = ({ children, className = '' }) => (
            <div className={`absolute pointer-events-none ${className}`}
                style={{ left: '50%', top: '50%', width: 'max(100%, calc(100vh * 16 / 9))', height: 'max(100%, calc(100vw * 9 / 16))',
                         transform: 'translate(-50%, -50%)', containerType: 'size' }}>
                {children}
            </div>
        );

        const App = () => {
            const [step, setStep] = useState(1);
            const [newsName, setNewsName] = useState('');
            const [anchorName, setAnchorName] = useState('');
            const [weatherCasterName, setWeatherCasterName] = useState('');
            const [citizenNames, setCitizenNames] = useState(['']);
            const [currentCitizenIndex, setCurrentCitizenIndex] = useState(0);
            
            const [weatherType, setWeatherType] = useState('coldspring');
            // 선생님이 바꾼 배경 이미지 (날씨 id -> 이미지 데이터). 이 브라우저에 저장되어 다음에도 유지됩니다.
            const [customImages, setCustomImages] = useState(() => loadSaved(IMAGE_KEY, {}));
            // '오늘의 날씨' 직접 설정 값
            const [customWeather, setCustomWeather] = useState(() => loadSaved(CUSTOM_KEY, DEFAULT_CUSTOM_WEATHER));
            const [imageNotice, setImageNotice] = useState('');
            const [isMediaPipeLoaded, setIsMediaPipeLoaded] = useState(false);
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const cameraRef = useRef(null);
            const selfieSegmentationRef = useRef(null);
            const isProcessingRef = useRef(false);
            const [showTitle, setShowTitle] = useState(false);
            const [hasCameraPermission, setHasCameraPermission] = useState(false);
            const [cameraError, setCameraError] = useState('');
            const globalStreamRef = useRef(null); 

            // 날씨별 배경 이미지 (선생님이 바꾼 이미지가 있으면 그것을 사용)
            const getBackground = (type) => customImages[type] || DEFAULT_BACKGROUNDS[type] || DEFAULT_BACKGROUNDS.custom;
            const getWeatherLabel = (type) => {
                if (type === 'custom') return customWeather.name.trim() || '오늘의 날씨';
                const found = WEATHER_OPTIONS.find(w => w.id === type);
                return found ? found.label : '';
            };

            // 배경 이미지 올리기 / 기본으로 되돌리기
            const handleImageUpload = async (type, file) => {
                if (!file) return;
                try {
                    const dataUrl = await resizeImage(file);
                    const next = { ...customImages, [type]: dataUrl };
                    setCustomImages(next);
                    setImageNotice(saveData(IMAGE_KEY, next)
                        ? ''
                        : '이미지가 적용됐지만 저장 공간이 부족해 새로고침하면 사라져요.');
                } catch (e) {
                    alert('이미지를 불러오지 못했어요. 다른 사진 파일로 다시 시도해주세요.');
                }
            };
            // 기본 배경 그림 중에서 고르기
            const handleSelectBuiltin = (type, url) => {
                if (url === DEFAULT_BACKGROUNDS[type]) { handleImageReset(type); return; }
                const next = { ...customImages, [type]: url };
                setCustomImages(next);
                saveData(IMAGE_KEY, next);
                setImageNotice('');
            };
            const getPreview = (type) => {
                const bg = getBackground(type);
                const builtin = BUILTIN_BACKGROUNDS.find(b => b.url === bg);
                return builtin ? builtin.thumb : bg;
            };

            // 처음 화면으로 돌아가기
            const goHome = () => {
                if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
                setStep(1);
                setCurrentCitizenIndex(0);
            };

            const handleImageReset = (type) => {
                const next = { ...customImages };
                delete next[type];
                setCustomImages(next);
                saveData(IMAGE_KEY, next);
                setImageNotice('');
            };

            // '오늘의 날씨' 값 바꾸기
            const updateCustomWeather = (patch) => {
                const next = { ...customWeather, ...patch };
                setCustomWeather(next);
                saveData(CUSTOM_KEY, next);
            };
            const updateCustomDay = (day, field, value) => {
                updateCustomWeather({ [day]: { ...customWeather[day], [field]: value } });
            };

            // 날짜 및 텍스트 렌더링 헬퍼 함수
            const getDates = (type) => {
                let baseDateStr;
                if (type === 'custom') {
                    const now = new Date();
                    baseDateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                } else {
                    const mappedDates = {
                        'coldspring': '2026-03-24',
                        'dust': '2026-03-16',
                        'monsoon': '2026-07-02',
                        'bigdiff': '2026-10-14',
                        'coldwave': '2026-01-20'
                    };
                    baseDateStr = mappedDates[type] || '2026-03-24';
                }
                const todayDate = new Date(baseDateStr + 'T12:00:00');
                
                const yesterday = new Date(todayDate);
                yesterday.setDate(todayDate.getDate() - 1);
                const tomorrow = new Date(todayDate);
                tomorrow.setDate(todayDate.getDate() + 1);

                return {
                    yesterdayStr: `어제 (${yesterday.getMonth() + 1}/${yesterday.getDate()})`,
                    todayStr: `오늘 (${todayDate.getMonth() + 1}/${todayDate.getDate()})`,
                    tomorrowStr: `내일 (${tomorrow.getMonth() + 1}/${tomorrow.getDate()})`
                };
            };

            // 선택된 날씨에 따른 날씨 UI 데이터 헬퍼 함수 (어제, 오늘, 내일 분리)
            const getRenderWeatherData = () => {
                if (weatherType === 'custom') {
                    const toDay = (d) => ({
                        icon: (ICON_OPTIONS.find(o => o.id === d.icon) || ICON_OPTIONS[0]).icon,
                        mainTemp: `${d.max === '' ? '-' : d.max}°C`,
                        subTemp: `${d.min === '' ? '-' : d.min}°C`
                    });
                    return {
                        yesterday: toDay(customWeather.yesterday),
                        today: { ...toDay(customWeather.today), bg: getBackground('custom') },
                        tomorrow: toDay(customWeather.tomorrow)
                    };
                }
                const weatherForecasts = {
                    coldspring: {
                        yesterday: { icon: CloudSun, mainTemp: '15°C', subTemp: '4°C' },
                        today: { icon: Wind, mainTemp: '6°C', subTemp: '-3°C', bg: 'https://images.unsplash.com/photo-1476820865390-c52aeebb9891?w=600&q=80' },
                        tomorrow: { icon: CloudSun, mainTemp: '9°C', subTemp: '-1°C' }
                    },
                    dust: {
                        yesterday: { icon: Sun, mainTemp: '15°C', subTemp: '6°C' },
                        today: { icon: Haze, mainTemp: '16°C', subTemp: '5°C', bg: 'https://images.unsplash.com/photo-1545134969-8debd725b733?w=600&q=80' },
                        tomorrow: { icon: CloudSun, mainTemp: '17°C', subTemp: '7°C' }
                    },
                    monsoon: {
                        yesterday: { icon: CloudRain, mainTemp: '27°C', subTemp: '22°C' },
                        today: { icon: CloudRain, mainTemp: '25°C', subTemp: '21°C', bg: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=600&q=80' },
                        tomorrow: { icon: CloudLightning, mainTemp: '26°C', subTemp: '22°C' }
                    },
                    bigdiff: {
                        yesterday: { icon: Sun, mainTemp: '21°C', subTemp: '8°C' },
                        today: { icon: Sun, mainTemp: '23°C', subTemp: '6°C', bg: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&q=80' },
                        tomorrow: { icon: CloudSun, mainTemp: '22°C', subTemp: '7°C' }
                    },
                    coldwave: {
                        yesterday: { icon: CloudSun, mainTemp: '-1°C', subTemp: '-8°C' },
                        today: { icon: Sun, mainTemp: '-8°C', subTemp: '-16°C', bg: 'https://images.unsplash.com/photo-1542601098-3adb3baeb1ec?w=600&q=80' },
                        tomorrow: { icon: CloudSnow, mainTemp: '-5°C', subTemp: '-13°C' }
                    }
                };
                return weatherForecasts[weatherType] || weatherForecasts.coldspring;
            };

            const dates = getDates(weatherType);
            const renderData = getRenderWeatherData();

            // 카메라 연결 (실패하면 이유를 화면에 알려주고 다시 시도할 수 있게 함)
            const requestCameraPermission = async () => {
                setCameraError('');
                if (window.self !== window.top) {
                    setCameraError('미리보기 창에서는 카메라를 쓸 수 없어요. 파일을 크롬(또는 엣지·웨일)에서 직접 열어주세요.');
                    return;
                }
                if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    setCameraError('이 주소에서는 카메라를 쓸 수 없어요. https:// 주소나 컴퓨터에 저장한 파일로 열어주세요.');
                    return;
                }
                try {
                    if (globalStreamRef.current) globalStreamRef.current.getTracks().forEach(t => t.stop());
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
                    // 핵심 포인트: file:// 환경에서 매번 묻는 것을 방지하기 위해 
                    // 카메라 스트림을 바로 끄지 않고 백그라운드에 계속 유지시켜 둡니다.
                    globalStreamRef.current = stream; 
                    setHasCameraPermission(true);
                } catch (err) {
                    console.error("카메라 연결 실패:", err);
                    setHasCameraPermission(false);
                    const messages = {
                        NotAllowedError: '카메라가 차단되어 있어요. 주소창 왼쪽 자물쇠(또는 ⓘ) 아이콘 → 카메라 → 허용으로 바꾼 뒤 [다시 시도]를 눌러주세요. 윈도우 설정 → 개인정보 → 카메라에서 브라우저 접근이 꺼져 있는지도 확인해주세요.',
                        NotReadableError: '다른 프로그램(줌, 팀즈, 카메라 앱, 다른 크롬 탭 등)이 카메라를 쓰고 있어요. 그 프로그램을 닫고 [다시 시도]를 눌러주세요.',
                        NotFoundError: '연결된 카메라를 찾지 못했어요. 웹캠이 꽂혀 있는지 확인하고 [다시 시도]를 눌러주세요.',
                        OverconstrainedError: '카메라 설정을 맞추지 못했어요. [다시 시도]를 눌러주세요.'
                    };
                    setCameraError(messages[err.name] || `카메라를 켜지 못했어요 (${err.name}). [다시 시도]를 눌러주세요.`);
                }
            };

            useEffect(() => {
                requestCameraPermission();

                // 주소창에서 권한을 '허용'으로 바꾸면 자동으로 다시 연결
                let permStatus;
                const onPermChange = () => { if (permStatus.state === 'granted') requestCameraPermission(); };
                if (navigator.permissions && navigator.permissions.query) {
                    navigator.permissions.query({ name: 'camera' }).then(st => {
                        permStatus = st;
                        st.addEventListener('change', onPermChange);
                    }).catch(() => {});
                }

                return () => {
                    if (permStatus) permStatus.removeEventListener('change', onPermChange);
                    // 브라우저 탭을 닫거나 앱이 종료될 때만 카메라를 완전히 끕니다.
                    if (globalStreamRef.current) {
                        globalStreamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            useEffect(() => {
                const loadScript = (src) => {
                    return new Promise((resolve, reject) => {
                        if (document.querySelector(`script[src="${src}"]`)) {
                            resolve();
                            return;
                        }
                        const script = document.createElement('script');
                        script.src = src;
                        script.crossOrigin = 'anonymous';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.body.appendChild(script);
                    });
                };

                const initMediaPipe = async () => {
                    try {
                        await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js');
                        
                        if (window.SelfieSegmentation) {
                            setIsMediaPipeLoaded(true);
                        } else {
                            console.error("MediaPipe 라이브러리를 로드하지 못했습니다.");
                        }
                    } catch (error) {
                        console.error("스크립트 로드 오류:", error);
                    }
                };

                initMediaPipe();
                return () => {
                    if (cameraRef.current) cameraRef.current.stop();
                    if (selfieSegmentationRef.current) selfieSegmentationRef.current.close();
                };
            }, []);

            const onResults = (results) => {
                if (!canvasRef.current || !results || !results.image || !results.segmentationMask) return;
                const canvasCtx = canvasRef.current.getContext('2d');
                const canvas = canvasRef.current;
                
                if (results.image.width === 0 || results.image.height === 0) return;
                
                canvas.width = results.image.width;
                canvas.height = results.image.height;

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                canvasCtx.globalCompositeOperation = 'copy';
                canvasCtx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);

                canvasCtx.globalCompositeOperation = 'source-in';
                canvasCtx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
                canvasCtx.restore();
            };

            // 처음에 허용받은 카메라 영상을 그대로 다시 사용 (카메라를 새로 켜지 않으므로 권한을 또 묻지 않음)
            const startCameraAndSegmentation = () => {
                const video = videoRef.current;
                const stream = globalStreamRef.current;
                if (!isMediaPipeLoaded || !video || !stream) return;

                if (video.srcObject !== stream) video.srcObject = stream;
                video.play().catch(() => {});

                if (!selfieSegmentationRef.current) {
                    selfieSegmentationRef.current = new window.SelfieSegmentation({locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
                    }});
                    selfieSegmentationRef.current.setOptions({ modelSelection: 1 });
                }
                selfieSegmentationRef.current.onResults(onResults);

                let running = true;
                let rafId = null;
                const tick = async () => {
                    if (!running) return;
                    if (!isProcessingRef.current && video.readyState >= 2 && video.videoWidth > 0) {
                        isProcessingRef.current = true;
                        try {
                            await selfieSegmentationRef.current.send({ image: video });
                        } catch (err) {
                            console.warn("MediaPipe Frame Error (Ignored):", err);
                        } finally {
                            isProcessingRef.current = false;
                        }
                    }
                    if (running) rafId = requestAnimationFrame(tick);
                };
                tick();
                cameraRef.current = { stop: () => { running = false; if (rafId) cancelAnimationFrame(rafId); } };
            };

            const stopCamera = () => {
                if (cameraRef.current) {
                    cameraRef.current.stop();
                    cameraRef.current = null; // 완전히 초기화하여 재시작 시 꼬임 방지
                }
            };

            useEffect(() => {
                // 방송 단계(3~7)에 진입했고, MediaPipe가 로드되었으며, 카메라가 아직 켜지지 않았을 때만 시작
                if (step >= 3 && step <= 7) {
                    if (isMediaPipeLoaded && hasCameraPermission && !cameraRef.current) {
                        startCameraAndSegmentation();
                    }
                } else if (step < 3 || step > 7) {
                    // 방송 단계를 벗어나면 (예: 1단계, 2단계) 카메라 중지
                    stopCamera();
                }
            }, [step, isMediaPipeLoaded, hasCameraPermission]);

            const handleStartBroadcast = () => {
                if (!newsName || !anchorName || !weatherCasterName || citizenNames.some(name => !name)) {
                    alert('모든 정보를 입력해주세요.');
                    return;
                }
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(err => {
                            console.warn("전체화면 요청 거부됨:", err);
                        });
                    }
                } catch (e) {
                    console.warn("Fullscreen API 오류", e);
                }
                setStep(2);
            };

            const handleAddCitizen = () => {
                if (citizenNames.length < 3) setCitizenNames([...citizenNames, '']);
            };

            const handleCitizenNameChange = (index, value) => {
                const newNames = [...citizenNames];
                newNames[index] = value;
                setCitizenNames(newNames);
            };

            const handleNext = () => {
                if (step === 2) {
                     setShowTitle(false);
                     setStep(3);
                } else if (step === 5) {
                    if (currentCitizenIndex < citizenNames.length - 1) {
                        setCurrentCitizenIndex(prev => prev + 1);
                    } else {
                        setStep(6);
                    }
                } else if (step === 7) {
                    if (document.fullscreenElement) document.exitFullscreen().catch(console.error);
                    setStep(1);
                    setCurrentCitizenIndex(0);
                } else {
                    setStep(prev => prev + 1);
                }
            };

            useEffect(() => {
                let timer;
                if (step === 2) {
                    timer = setTimeout(() => setShowTitle(true), 3000);
                } else {
                    setShowTitle(false);
                }
                return () => clearTimeout(timer);
            }, [step]);

            return (
                <div className="w-full h-screen font-sans overflow-hidden">
                    <video ref={videoRef} className="hidden" playsInline autoPlay muted></video>

                    {step > 1 && (
                        <button onClick={goHome}
                            className="fixed top-6 left-6 z-[60] flex items-center gap-2 bg-black/30 hover:bg-black/60 text-white/70 hover:text-white font-bold px-4 py-2 rounded-full backdrop-blur-md transition">
                            🏠 처음으로
                        </button>
                    )}

                    {step === 1 && (
                        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-200 flex items-center justify-center p-4">
                            <div className="bg-white p-10 rounded-3xl shadow-2xl max-w-2xl w-full border-4 border-blue-100 relative max-h-screen overflow-y-auto">
                                {!isMediaPipeLoaded && (
                                    <div className="absolute top-2 right-2 text-xs text-red-500 font-bold bg-red-100 p-2 rounded">
                                        시스템 준비 중... (잠시만 기다려주세요)
                                    </div>
                                )}
                                {!hasCameraPermission && (
                                    <div className="mb-6 mt-4 p-4 bg-red-50 border-2 border-red-300 rounded-2xl flex items-start gap-3">
                                        <div className="flex-1 text-sm text-red-700 font-bold leading-relaxed">
                                            📷 {cameraError || '카메라 연결 중이에요. 브라우저 위쪽에 뜨는 창에서 [허용]을 눌러주세요.'}
                                        </div>
                                        <button onClick={requestCameraPermission}
                                            className="flex-shrink-0 bg-red-500 hover:bg-red-600 text-white text-sm font-bold px-4 py-2 rounded-full">
                                            다시 시도
                                        </button>
                                    </div>
                                )}
                                <h1 className="text-4xl font-extrabold text-blue-600 mb-8 text-center flex items-center justify-center gap-4">
                                    <Video size={40} className="w-10 h-10" /> 날씨 예보 방송 준비
                                </h1>
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">뉴스 이름</label>
                                        <input type="text" placeholder="예: 튼튼 뉴스" value={newsName} onChange={e => setNewsName(e.target.value)} 
                                            className="w-full p-4 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 text-xl font-bold" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-gray-700 font-bold mb-2">뉴스 진행자(앵커)</label>
                                            <input type="text" placeholder="이름 입력" value={anchorName} onChange={e => setAnchorName(e.target.value)} 
                                                className="w-full p-4 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 text-xl" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-bold mb-2">기상캐스터</label>
                                            <input type="text" placeholder="이름 입력" value={weatherCasterName} onChange={e => setWeatherCasterName(e.target.value)} 
                                                className="w-full p-4 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 text-xl" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2 flex items-center justify-between">
                                            <span>인터뷰할 시민 (최대 3명)</span>
                                            {citizenNames.length < 3 && (
                                                <button onClick={handleAddCitizen} className="text-blue-500 hover:text-blue-700 flex items-center text-sm bg-blue-50 px-3 py-1 rounded-full">
                                                    <Plus size={16} className="mr-1" /> 인원 추가
                                                </button>
                                            )}
                                        </label>
                                        <div className="space-y-3">
                                            {citizenNames.map((name, index) => (
                                                <input key={index} type="text" placeholder={`시민 ${index + 1} 이름`} value={name} onChange={e => handleCitizenNameChange(index, e.target.value)} 
                                                    className="w-full p-4 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 text-xl" />
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">오늘의 날씨 (시민 인터뷰 배경)</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {WEATHER_OPTIONS.map(weather => (
                                                <button 
                                                    key={weather.id}
                                                    onClick={() => setWeatherType(weather.id)}
                                                    className={`py-3 rounded-xl border-2 font-bold text-lg transition-colors ${weatherType === weather.id ? 'bg-blue-500 text-white border-blue-500' : (weather.id === 'custom' ? 'bg-yellow-50 text-yellow-700 border-yellow-300 border-dashed hover:bg-yellow-100' : 'bg-gray-100 text-gray-600 border-gray-200 hover:bg-gray-200')}`}
                                                >
                                                    {weather.id === 'custom' ? `✏️ ${getWeatherLabel('custom')}` : weather.label}
                                                </button>
                                            ))}
                                        </div>

                                        {/* 선택한 날씨의 설정칸 */}
                                        <div className="mt-4 p-4 bg-blue-50 rounded-2xl border-2 border-blue-100 space-y-4">
                                            {weatherType === 'custom' && (
                                                <div>
                                                    <label className="block text-gray-700 font-bold mb-2 text-sm">날씨 이름</label>
                                                    <input type="text" placeholder="예: 가을비, 태풍, 황사" value={customWeather.name}
                                                        onChange={e => updateCustomWeather({ name: e.target.value })}
                                                        className="w-full p-3 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 text-lg font-bold bg-white" />
                                                </div>
                                            )}

                                            <div className="flex items-center gap-4">
                                                <img src={getPreview(weatherType)} alt="인터뷰 배경 미리보기"
                                                    className="w-40 h-24 object-cover rounded-xl border-2 border-white shadow bg-gray-200 flex-shrink-0" />
                                                <div className="flex-1 min-w-0">
                                                    <p className="font-bold text-gray-700 mb-2 truncate">'{getWeatherLabel(weatherType)}' 인터뷰 배경</p>
                                                    <div className="flex flex-wrap gap-2">
                                                        <label className="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold px-4 py-2 rounded-full">
                                                            🖼️ 이미지 바꾸기
                                                            <input type="file" accept="image/*" className="hidden"
                                                                onChange={e => { handleImageUpload(weatherType, e.target.files[0]); e.target.value = ''; }} />
                                                        </label>
                                                        {customImages[weatherType] && (
                                                            <button onClick={() => handleImageReset(weatherType)}
                                                                className="bg-white hover:bg-gray-100 text-gray-600 text-sm font-bold px-4 py-2 rounded-full border border-gray-300">
                                                                기본 이미지로
                                                            </button>
                                                        )}
                                                    </div>
                                                    {weatherType === 'custom' && !customImages.custom && (
                                                        <p className="text-xs text-yellow-700 mt-2">사진을 올리거나 아래 기본 배경에서 골라주세요. (지금은 임시 배경)</p>
                                                    )}
                                                    {imageNotice && <p className="text-xs text-red-500 mt-2">{imageNotice}</p>}
                                                </div>
                                            </div>

                                            <div>
                                                <p className="text-gray-700 font-bold mb-2 text-sm">기본 배경에서 고르기</p>
                                                <div className="grid grid-cols-4 sm:grid-cols-7 gap-2">
                                                    {BUILTIN_BACKGROUNDS.map(bgItem => {
                                                        const selected = getBackground(weatherType) === bgItem.url;
                                                        return (
                                                            <button key={bgItem.id} onClick={() => handleSelectBuiltin(weatherType, bgItem.url)} title={bgItem.label}
                                                                className={`rounded-lg overflow-hidden border-4 transition ${selected ? 'border-blue-500 shadow-md' : 'border-transparent hover:border-blue-200'}`}>
                                                                <img src={bgItem.thumb} alt={bgItem.label} className="w-full aspect-video object-cover block" />
                                                                <span className={`block text-[11px] font-bold py-1 truncate ${selected ? 'bg-blue-500 text-white' : 'bg-white text-gray-600'}`}>{bgItem.label}</span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                            {weatherType === 'custom' && (
                                                <div>
                                                    <label className="block text-gray-700 font-bold mb-2 text-sm">기상캐스터 화면에 나올 날씨</label>
                                                    <div className="space-y-2">
                                                        {[['yesterday', '어제'], ['today', '오늘'], ['tomorrow', '내일']].map(([day, dayLabel]) => (
                                                            <div key={day} className="grid grid-cols-[3rem_1fr_1fr_1fr] gap-2 items-center">
                                                                <span className="font-bold text-gray-600">{dayLabel}</span>
                                                                <select value={customWeather[day].icon} onChange={e => updateCustomDay(day, 'icon', e.target.value)}
                                                                    className="p-2 border-2 border-blue-200 rounded-lg bg-white focus:outline-none focus:border-blue-500">
                                                                    {ICON_OPTIONS.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                                                                </select>
                                                                <div className="flex items-center gap-1">
                                                                    <input type="number" value={customWeather[day].max} onChange={e => updateCustomDay(day, 'max', e.target.value)}
                                                                        placeholder="최고" className="w-full p-2 border-2 border-red-200 rounded-lg bg-white focus:outline-none focus:border-red-400" />
                                                                    <span className="text-sm text-red-500 font-bold whitespace-nowrap">최고</span>
                                                                </div>
                                                                <div className="flex items-center gap-1">
                                                                    <input type="number" value={customWeather[day].min} onChange={e => updateCustomDay(day, 'min', e.target.value)}
                                                                        placeholder="최저" className="w-full p-2 border-2 border-blue-200 rounded-lg bg-white focus:outline-none focus:border-blue-400" />
                                                                    <span className="text-sm text-blue-500 font-bold whitespace-nowrap">최저</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <p className="text-xs text-gray-500 mt-2">날짜는 방송하는 날 기준으로 자동 표시돼요.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleStartBroadcast} 
                                        disabled={!isMediaPipeLoaded || !hasCameraPermission}
                                        className={`w-full mt-8 p-5 text-white rounded-2xl font-extrabold text-2xl transition shadow-lg flex items-center justify-center gap-3 ${isMediaPipeLoaded && hasCameraPermission ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-400 cursor-not-allowed'}`}>
                                        <Play fill="currentColor" size={28} /> {isMediaPipeLoaded && hasCameraPermission ? '방송 시작하기' : (hasCameraPermission ? '준비 중...' : '카메라 권한 필요')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="relative w-full h-screen bg-black">
                            <video 
                                className="w-full h-full object-cover" 
                                src="https://github.com/sae6gnicky/weathercast/raw/main/opening.mp4" 
                                autoPlay 
                                onEnded={handleNext} 
                            />
                            {showTitle && (
                                <CoverBox className="z-10">
                                    {/* 오프닝 영상의 빨간 띠: 세로 73.7%~87.2%, 가로 0~약 70% */}
                                    <div className="absolute flex items-center justify-center"
                                        style={{ left: '3%', width: '63%', top: '73.7%', height: '13.5%' }}>
                                        <h1 className="text-white whitespace-nowrap leading-none"
                                            style={{ fontFamily: "'Noto Sans KR', sans-serif", fontWeight: 900, letterSpacing: '0.08em',
                                                     fontSize: `min(8.5cqh, ${(58 / Math.max(newsName.length, 1)).toFixed(2)}cqw)`,
                                                     textShadow: '0 0.4cqh 0.8cqh rgba(0,0,0,0.45)', WebkitTextStroke: '0.15cqh white' }}>
                                            {newsName}
                                        </h1>
                                    </div>
                                </CoverBox>
                            )}
                            <button onClick={handleNext} className="absolute top-6 right-6 text-white/50 hover:text-white bg-black/30 px-4 py-2 rounded-full z-20">건너뛰기</button>
                        </div>
                    )}

                    {(step === 3 || step === 7) && (
                        <div className="relative w-full h-screen bg-black">
                            <img src="https://github.com/sae6gnicky/weathercast/raw/main/bground.png" alt="뉴스룸 배경" className="absolute inset-0 w-full h-full object-cover" />
                            
                            <div className="absolute bottom-0 left-0 w-full h-[95%] flex items-end justify-center z-10 pointer-events-none">
                                <canvas ref={canvasRef} className="w-full h-full object-contain object-bottom -scale-x-100" />
                            </div>
                            
                            <img src="https://github.com/sae6gnicky/weathercast/raw/main/title.png" alt="뉴스 타이틀" className="absolute inset-0 w-full h-full z-20 object-cover pointer-events-none" />
                            
                            {step === 3 && (
                                <CoverBox className="z-30">
                                    {/* 타이틀 그림의 흰 띠: 세로 77.4%~86.7% / '오늘의 날씨' 글자는 가로 45.6%에서 끝남 */}
                                    <div className="absolute flex items-center"
                                        style={{ left: '47.4%', top: '77.4%', height: '9.3%', gap: '1.2cqw' }}>
                                        <span style={{ width: '0.35cqw', height: '5.2cqh', background: '#7a0a26', borderRadius: '1cqh' }}></span>
                                        <span className="whitespace-nowrap leading-none"
                                            style={{ fontFamily: "'Noto Sans KR', sans-serif", fontWeight: 900, fontSize: '5cqh',
                                                     color: '#7a0a26', maxWidth: '15cqw', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                            {anchorName}
                                        </span>
                                        <span className="leading-none text-gray-600"
                                            style={{ fontFamily: "'Noto Sans KR', sans-serif", fontWeight: 700, fontSize: '3.2cqh' }}>
                                            앵커
                                        </span>
                                    </div>
                                </CoverBox>
                            )}

                            <button onClick={handleNext} className="absolute top-1/2 right-6 transform -translate-y-1/2 bg-white/20 hover:bg-white/40 p-5 rounded-full backdrop-blur-md z-50 transition cursor-pointer pointer-events-auto">
                                <ChevronRight size={50} color="white" />
                            </button>
                        </div>
                    )}

                    {(step === 4 || step === 6) && (
                        <div className="relative w-full h-screen bg-blue-500">
                            <img src="https://github.com/sae6gnicky/weathercast/raw/main/2.png" alt="날씨 배경" className="absolute inset-0 w-full h-full object-cover" />
                            
                            <div className="absolute top-8 right-12 z-20 flex space-x-8 text-white bg-black/20 p-5 rounded-3xl backdrop-blur-md border border-white/20">
                                <div className="flex flex-col items-center"><Droplets size={28} className="mb-2 text-blue-200" /> <span className="font-bold text-lg">40%</span></div>
                                <div className="flex flex-col items-center"><Wind size={28} className="mb-2 text-gray-200" /> <span className="font-bold text-lg">24 KM/H</span></div>
                                <div className="flex flex-col items-center"><Compass size={28} className="mb-2 text-gray-200" /> <span className="font-bold text-lg">WEST</span></div>
                                <div className="flex flex-col items-center"><Gauge size={28} className="mb-2 text-gray-200" /> <span className="font-bold text-lg">1023 MB</span></div>
                            </div>

                            <div className="absolute top-40 right-12 z-20 w-[55%] grid grid-cols-3 gap-6">
                                <div className="bg-gradient-to-b from-blue-300/90 to-blue-500/90 rounded-3xl overflow-hidden shadow-2xl flex flex-col backdrop-blur-sm border border-white/30">
                                    <div className="bg-blue-200/40 py-4 text-center text-2xl font-extrabold text-white">{dates.yesterdayStr}</div>
                                    <div className="flex-1 p-6 flex flex-col items-center justify-center">
                                        <renderData.yesterday.icon size={90} color="white" className="mb-6 drop-shadow-md" />
                                        <span className="text-6xl font-black text-white">{renderData.yesterday.mainTemp}</span>
                                        <span className="text-3xl text-white/80 mt-3 font-bold">{renderData.yesterday.subTemp}</span>
                                    </div>
                                    <div className="h-32 bg-[url('https://images.unsplash.com/photo-1472824606709-0d1cf571c356?w=600&q=80')] bg-cover bg-center opacity-80"></div>
                                </div>

                                <div className="bg-gradient-to-b from-blue-400/95 to-blue-600/95 rounded-3xl overflow-hidden shadow-2xl flex flex-col backdrop-blur-sm transform scale-105 border-4 border-white/40 z-10">
                                    <div className="bg-blue-300/40 py-4 text-center text-3xl font-extrabold text-white text-shadow">{dates.todayStr}</div>
                                    <div className="flex-1 p-6 flex flex-col items-center justify-center">
                                        <renderData.today.icon size={110} color="white" className="mb-6 drop-shadow-lg" />
                                        <span className="text-7xl font-black text-white">{renderData.today.mainTemp}</span>
                                        <span className="text-4xl text-white/80 mt-3 font-bold">{renderData.today.subTemp}</span>
                                    </div>
                                    <div className="h-36 bg-cover bg-center opacity-90" style={{backgroundImage: `url('${renderData.today.bg}')`}}></div>
                                </div>

                                <div className="bg-gradient-to-b from-blue-300/90 to-blue-500/90 rounded-3xl overflow-hidden shadow-2xl flex flex-col backdrop-blur-sm border border-white/30">
                                    <div className="bg-blue-200/40 py-4 text-center text-2xl font-extrabold text-white">{dates.tomorrowStr}</div>
                                    <div className="flex-1 p-6 flex flex-col items-center justify-center">
                                        <renderData.tomorrow.icon size={90} color="white" className="mb-6 drop-shadow-md" />
                                        <span className="text-6xl font-black text-white">{renderData.tomorrow.mainTemp}</span>
                                        <span className="text-3xl text-white/80 mt-3 font-bold">{renderData.tomorrow.subTemp}</span>
                                    </div>
                                    <div className="h-32 bg-[url('https://images.unsplash.com/photo-1605727216801-e27ce1d0ce30?w=600&q=80')] bg-cover bg-center opacity-80"></div>
                                </div>
                            </div>

                            <div className="absolute bottom-12 left-12 bg-green-600/90 text-white px-8 py-4 rounded-2xl border-l-8 border-green-300 z-50 shadow-2xl">
                                 <p className="text-[35px] leading-tight font-extrabold">{weatherCasterName}</p>
                            </div>

                            <div className="absolute bottom-0 left-10 h-[80%] z-40 flex items-end pointer-events-none">
                                <canvas ref={canvasRef} className="h-full object-contain aspect-video -scale-x-100" />
                            </div>

                            <button onClick={handleNext} className="absolute top-1/2 right-6 transform -translate-y-1/2 bg-white/20 hover:bg-white/40 p-5 rounded-full backdrop-blur-md z-50 transition cursor-pointer pointer-events-auto">
                                <ChevronRight size={50} color="white" />
                            </button>
                        </div>
                    )}

                    {step === 5 && (
                        <div className="relative w-full h-screen bg-black">
                            <img src={getBackground(weatherType)} alt="야외 배경" className="absolute inset-0 w-full h-full object-cover opacity-90" />
                            
                            <div className="absolute bottom-0 left-0 w-full h-[95%] flex items-end justify-center z-10 pointer-events-none">
                                <canvas ref={canvasRef} className="w-full h-full object-contain object-bottom -scale-x-100" />
                            </div>

                            <div className="absolute bottom-12 left-12 bg-red-600/90 text-white px-8 py-4 rounded-2xl border-l-8 border-red-300 z-50 shadow-2xl">
                                <p className="text-xl text-red-200 font-bold mb-1">시민 인터뷰</p>
                                <p className="text-[35px] leading-tight font-extrabold">{citizenNames[currentCitizenIndex]}</p>
                            </div>

                            <button onClick={handleNext} className="absolute top-1/2 right-6 transform -translate-y-1/2 bg-white/20 hover:bg-white/40 p-5 rounded-full backdrop-blur-md z-50 transition cursor-pointer pointer-events-auto">
                                <ChevronRight size={50} color="white" />
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
